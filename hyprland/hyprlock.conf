# lock screen, styled like the bar: black, Hack, #535d6c accent, monokai check/fail

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(0, 0, 0)
}

# time and date turn red after a failed attempt, like slock
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/locklabel.sh time $ATTEMPTS
    font_size = 96
    font_family = Hack Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/locklabel.sh date $ATTEMPTS
    font_size = 18
    font_family = Hack Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 36
    outline_thickness = 1
    rounding = 0
    outer_color = rgb(83, 93, 108)
    inner_color = rgb(34, 34, 34)
    font_color = rgb(255, 255, 255)
    font_family = Hack Nerd Font
    check_color = rgb(166, 226, 46)
    fail_color = rgb(204, 34, 34)
    placeholder_text =
    fade_on_empty = true
    position = 0, -60
    halign = center
    valign = center
}
