# replaces: xautolock -notify 10 -time 15 -locker "... slock ..."
general {
    # screen off right after locking, like the old "xset dpms force off & slock"
    lock_cmd = pidof hyprlock || (hyprlock & sleep 1 && hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "off" }))')
    after_sleep_cmd = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "on" }))'
}

listener {
    timeout = 890
    # hyprctl notify renders in-compositor: works even while the awesome session
    # on tty1 owns the org.freedesktop.Notifications dbus name
    on-timeout = hyprctl notify -1 10000 "rgb(ff0000)" "Lock in 10 sec"
}

listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

listener {
    timeout = 905
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
